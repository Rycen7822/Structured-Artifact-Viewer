[package]
name = "structured-artifact-viewer"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "codex-view"
path = "src/main.rs"

[[bin]]
name = "structured-artifact-mcp-server"
path = "src/bin/structured_artifact_mcp_server.rs"

[dependencies]
csv = "1.3"
indexmap = "2.7"
regex = "1.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
shlex = "1.3"
toml = "0.8"
parquet = { version = "56.2", default-features = false, features = ["snap"] }

[dev-dependencies]
tempfile = "3.15"
